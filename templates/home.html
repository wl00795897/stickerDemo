<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Demo</title>
    <link href="../static/css/output.css" rel="stylesheet">
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"
      integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA=="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- <script src="{{ url_for('static', filename='js/message.js') }}"></script>   -->
    <div class="bg-[#a6c2ce] h-screen w-auto flex items-center justify-center">
      <form method="post" class=" bg-[#dbe5e3] text-3xl h-fit w-3/5 flex flex-col rounded-2xl shadow-lg overflow-hidden">
        <div class="bg-[#023459] flex justify-between gap-3">
          <p class="p-5 text-white">Chatroom demo</p>
        </div>
        <div class="flex flex-col items-center p-8 gap-3">
          {% if error %}
          <ul>
            <li>Warning: {{error}}</li>
          </ul>
          {% endif %}
          <input type="text" placeholder="Enter Name" name="name" value="{{name}}" class="rounded-lg w-4/5 placeholder-gray-300 placeholder:text-2xl pl-2"/>
          <input type="text" placeholder="Enter existing room Code" name="code" value="{{code}}" class="rounded-lg w-4/5 placeholder-gray-300 placeholder:text-2xl pl-2"/>
          <button type="submit" name="join" class="w-4/5 py-2.5 px-5 bg-[#a6c2ce] rounded-lg text-white text-lg hover:bg-[#023459] transition-colors">Join!</button>
          <button type="submit" name="create" class="w-4/5 py-2.5 px-5 bg-[#a6c2ce] rounded-lg text-white text-lg hover:bg-[#023459] transition-colors">Add a new room</button>
        </div>
      </form>
    </div>

  </body>
</html>
